<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Lab Core</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Top menu bar: app menus on the left, plugin entries + status on the right. -->
  <header class="menubar" id="menubar">
    <div class="menubar-left">
      <span class="apple" aria-hidden="true">
        <svg viewBox="0 0 16 18" width="15" height="17">
          <path d="M8 2.2c-1.4 0-2.3.8-2.9 2C3.8 6 3.2 7.4 3.2 9.6c0 3 1.9 6.9 4.1 6.9.9 0 1.3-.6 2-.6s1.1.6 2 .6c2.2 0 4.1-3.9 4.1-6.9 0-2.2-.6-3.6-1.9-5.4-.6-1.2-1.5-2-2.9-2z"/>
          <path d="M8 2.2c.1-1.2 1-1.9 2.2-2" fill="none" stroke="currentColor" stroke-width="1.1"/>
        </svg>
      </span>
      <strong class="app-name">Home Lab Core</strong>
      <nav class="menu-items">
        <button class="menu-item" data-menu="file">文件</button>
        <button class="menu-item" data-menu="edit">编辑</button>
        <button class="menu-item" data-menu="view">显示</button>
        <button class="menu-item" data-menu="plugins">插件</button>
        <button class="menu-item" data-menu="help">帮助</button>
      </nav>
    </div>
    <div class="menubar-right">
      <span class="status" title="系统状态">◈</span>
      <span class="clock" id="clock"></span>
    </div>
  </header>

  <!-- Desktop: wallpaper plus freely movable windows. -->
  <main class="desktop" id="desktop">
    <div class="wallpaper" aria-hidden="true"></div>
    <div class="windows" id="windows"></div>
    <div class="desktop-hint">双击桌面空白处可新建窗口</div>
  </main>

  <!-- Bottom taskbar / dock. -->
  <footer class="dock" id="dock" aria-label="任务栏"></footer>

  <script src="js/app.js"></script>
</body>
</html>
